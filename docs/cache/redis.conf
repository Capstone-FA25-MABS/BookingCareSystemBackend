# Redis Configuration for BookingCare Development
# Place this file in the same directory as docker-compose.redis.yml

# Network
bind 0.0.0.0
port 6379

# General
daemonize no
protected-mode no
tcp-keepalive 300

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Append only file
appendonly yes
appendfsync everysec

# Logging
loglevel notice

# Performance
tcp-backlog 511
timeout 0

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Security (uncomment and set password for production)
# requirepass your_redis_password

# Enable keyspace notifications for cache events
notify-keyspace-events Ex
