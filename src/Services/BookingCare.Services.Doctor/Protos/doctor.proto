syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Doctor.Protos";

package doctor;

// The doctor service definition
service DoctorService {
  // Get doctor by ID
  rpc GetDoctor (GetDoctorRequest) returns (DoctorResponse);

  // Get doctor by account ID
  rpc GetDoctorByAccountId (GetDoctorByAccountIdRequest) returns (DoctorResponse);

  // Create new doctor
  rpc CreateDoctor (CreateDoctorRequest) returns (DoctorResponse);

  // Delete doctor for Saga compensation
  rpc DeleteDoctor (DeleteDoctorRequest) returns (DeleteDoctorResponse);

  // Batch retrieval for performance optimization
  rpc GetDoctorsByAccountIds (GetDoctorsByAccountIdsRequest) returns (DoctorBatchResponse);

  // Get doctor basic info with position and specialty names (optimized for performance)
  rpc GetDoctorBasicInfo (GetDoctorBasicInfoRequest) returns (DoctorBasicInfoResponse);

  // Get multiple doctors basic info (batch operation for performance)
  rpc GetDoctorsBasicInfo (GetDoctorsBasicInfoRequest) returns (DoctorsBasicInfoResponse);

  // Get available doctors by hospital, specialty, date, and time (for appointment assignment)
  rpc GetAvailableDoctors (GetAvailableDoctorsRequest) returns (GetAvailableDoctorsResponse);

  // Get doctor IDs only by hospital and specialty (optimized for schedule aggregation)
  rpc GetDoctorIdsByHospitalAndSpecialty (GetDoctorIdsByHospitalAndSpecialtyRequest) returns (GetDoctorIdsByHospitalAndSpecialtyResponse);

  // Get doctor price by price ID (for appointment rescheduling - Option 3)
  rpc GetDoctorPrice (GetDoctorPriceRequest) returns (GetDoctorPriceResponse);
  
  // Get specialty by ID (for Hospital service) - Optimized response
  rpc GetSpecialtyById (GetSpecialtyByIdRequest) returns (SpecialtySimpleResponse);

  // Get multiple specialties by IDs (bulk operation for performance)
  rpc GetSpecialtiesByIds (GetSpecialtiesByIdsRequest) returns (SpecialtiesBatchResponse);

  // Get doctor counts by specialty and hospital
  rpc GetDoctorCountsBySpecialtyAndHospital (GetDoctorCountsBySpecialtyAndHospitalRequest) returns (GetDoctorCountsBySpecialtyAndHospitalResponse);

  // Get service types by hospital with doctor count
  rpc GetServiceTypesByHospital (GetServiceTypesByHospitalRequest) returns (GetServiceTypesByHospitalResponse);

  // Get doctors with full details by hospital ID (optimized for hospital staff management - single call)
  rpc GetDoctorsByHospitalId (GetDoctorsByHospitalIdRequest) returns (DoctorBatchResponse);

  // Filter doctors for AI recommendations (by specialty IDs, location, with rating and experience)
  rpc FilterDoctorsForRecommendation (FilterDoctorsForRecommendationRequest) returns (FilterDoctorsForRecommendationResponse);
  
  // Get all active specialties (for AI service fuzzy matching)
  rpc GetAllSpecialties (GetAllSpecialtiesRequest) returns (GetAllSpecialtiesResponse);

  // Get doctors for assignment with full info (rating, experience, booking count) - for hospital staff assign doctor flow
  rpc GetDoctorsForAssignment (GetDoctorsForAssignmentRequest) returns (GetDoctorsForAssignmentResponse);
}

// Request messages
message GetDoctorRequest {
  string id = 1;
}

message GetDoctorByAccountIdRequest {
  string account_id = 1;
}

message CreateDoctorRequest {
  string account_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string gender = 5;           // MALE, FEMALE, OTHER
  string address = 6;
  string specialty_id = 7;
  string position_id = 8;
  string hospital_id = 9;
  string bio = 10;
  int32 years_of_experience = 11;
  string avatar_url = 12;
  repeated string language_ids = 13;
  repeated DoctorPriceInput prices = 14;
}

message DoctorPriceInput {
  string service_type_id = 1;
  double amount = 2;
}

// Request message for batch doctor retrieval
message GetDoctorsByAccountIdsRequest {
  repeated string account_ids = 1;
}

// Response messages
message DoctorResponse {
  string id = 1;
  string account_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string full_name = 6;
  string gender = 7;
  string address = 8;
  string specialty_id = 9;
  string position_id = 10;
  string hospital_id = 11;
  string bio = 12;
  int32 years_of_experience = 13;
  string avatar_url = 14;
  string created_at = 15; // ISO 8601
  string updated_at = 16; // ISO 8601
  string status = 17; // "ACTIVE" or "INACTIVE"
}

// Lightweight doctor information for performance optimization
message DoctorBasicInfo {
  string account_id = 1;
  string email = 2;
  string full_name = 3;
  string avatar_url = 4;
  string address = 5;
}

// Response message for batch doctor retrieval
message DoctorBatchResponse {
  repeated DoctorBasicInfo doctors = 1;
}

message DeleteDoctorRequest {
  string id = 1;
}

message DeleteDoctorResponse {
  bool success = 1;
  string message = 2;
}

// Request message for getting doctor basic info
message GetDoctorBasicInfoRequest {
  string id = 1;
}

// Request message for getting multiple doctors basic info
message GetDoctorsBasicInfoRequest {
  repeated string ids = 1;
  string service_type_name = 2; // Optional: e.g., "IN_PERSON", "TELEHEALTH" - to include consultation fee
}

// Request message for getting specialty by ID
message GetSpecialtyByIdRequest {
  string id = 1;
}

// Request message for getting multiple specialties by IDs
message GetSpecialtiesByIdsRequest {
  repeated string ids = 1;
}

// Response message for doctor basic info with position and specialty names
message DoctorBasicInfoResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  string position_name = 6;
  string specialty_name = 7;
  string avatar_url = 8;
  string hospital_id = 9;
  double consultation_fee = 10; // Optional: consultation fee based on service_type_name from request (0 if not found or not requested)
}

// Response message for multiple doctors basic info
message DoctorsBasicInfoResponse {
  repeated DoctorBasicInfoResponse doctors = 1;
}

// Request message for getting available doctors
message GetAvailableDoctorsRequest {
  string hospital_id = 1;
  string specialty_id = 2;
}

// Available doctor information (lightweight for performance)
message AvailableDoctorInfo {
  string id = 1;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  string avatar_url = 6;
  string position_name = 7;
  string specialty_name = 8;
  int32 years_of_experience = 9;
}

// Response message for available doctors
message GetAvailableDoctorsResponse {
  repeated AvailableDoctorInfo doctors = 1;
  int32 total_count = 2;
}

// Request message for getting doctor IDs only (optimized for schedule aggregation)
message GetDoctorIdsByHospitalAndSpecialtyRequest {
  string hospital_id = 1;
  string specialty_id = 2;
  string appointment_type = 3; // Optional: "IN_PERSON" or "TELEHEALTH" - filters doctors by service type
}

// Response message for doctor IDs only (lightweight)
message GetDoctorIdsByHospitalAndSpecialtyResponse {
  repeated string doctor_ids = 1;
  int32 total_count = 2;
}

// Request message for getting doctor price by ID
message GetDoctorPriceRequest {
  string price_id = 1;
}

// Response message for doctor price
message GetDoctorPriceResponse {
  string id = 1;
  string doctor_id = 2;
  double amount = 5;
  string currency = 6; // "VND"
}

// Response message for specialty
message SpecialtyResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  string status = 5;
}

// Optimized response message for specialty (only essential fields)
message SpecialtySimpleResponse {
  string id = 1;
  string name = 2;
  string image_url = 3;
}

// Response message for multiple specialties batch
message SpecialtiesBatchResponse {
  repeated SpecialtySimpleResponse specialties = 1;
}

// Request message for getting doctor counts by specialty and hospital
message GetDoctorCountsBySpecialtyAndHospitalRequest {
  string hospital_id = 1;
  repeated string specialty_ids = 2;
}

// Response message for doctor counts by specialty and hospital
message GetDoctorCountsBySpecialtyAndHospitalResponse {
  map<string, int32> specialty_counts = 1;
}

// Request message for getting service types by hospital
message GetServiceTypesByHospitalRequest {
  string hospital_id = 1;
}

// Response message for service types by hospital with doctor count
message ServiceTypeWithDoctorCountResponse {
  string id = 1;
  string name = 2;
  string image_url = 3;
  int32 doctor_count = 4;
}

// Response message for multiple service types by hospital
message GetServiceTypesByHospitalResponse {
  repeated ServiceTypeWithDoctorCountResponse service_types = 1;
}

// Request message for getting doctors with full details by hospital ID
message GetDoctorsByHospitalIdRequest {
  string hospital_id = 1;
}

// Request message for filtering doctors for AI recommendations
message FilterDoctorsForRecommendationRequest {
  repeated string specialty_ids = 1; // List of specialty IDs to filter
  string province_id = 2; // Optional: province ID for location filtering
  string district_id = 3; // Optional: district ID for location filtering
  int32 max_results = 4; // Maximum number of results to return (default: 10)
}

// Response message for filtered doctors with recommendation data
message DoctorRecommendationInfo {
  string id = 1;
  string full_name = 2;
  string specialty_name = 3;
  string hospital_name = 4;
  double rating = 5;
  int32 years_of_experience = 6;
  string service_type_name = 7; // Optional: service type name
  double consultation_fee = 8; // Optional: consultation fee in VND
  string hospital_id = 9;
  string avatar_url = 10;
}

// Response message for filtered doctors
message FilterDoctorsForRecommendationResponse {
  repeated DoctorRecommendationInfo doctors = 1;
  int32 total_count = 2;
}

// Request message for getting all active specialties
message GetAllSpecialtiesRequest {
  // Empty request - returns all active specialties
}

// Response message for all specialties
message GetAllSpecialtiesResponse {
  repeated SpecialtySimpleResponse specialties = 1;
}

// Request message for getting doctors for assignment (hospital staff assign doctor flow)
message GetDoctorsForAssignmentRequest {
  string hospital_id = 1;           // Required: Hospital ID
  string specialty_id = 2;          // Required: Specialty ID
  string appointment_type = 3;      // Required: "IN_PERSON" or "TELEHEALTH"
  repeated string doctor_ids = 4;   // Optional: Filter by specific doctor IDs (for previous doctors section)
}

// Doctor info for assignment with full details
message DoctorForAssignmentInfo {
  string id = 1;
  string account_id = 2;
  string full_name = 3;
  string avatar_url = 4;
  string position_name = 5;
  string specialty_name = 6;
  int32 years_of_experience = 7;
  double rating = 8;                // Average rating from reviews
  int32 review_count = 9;           // Total number of reviews
  double consultation_fee = 10;     // Consultation fee for the appointment type
  bool is_active = 11;              // Account status
}

// Response message for doctors for assignment
message GetDoctorsForAssignmentResponse {
  repeated DoctorForAssignmentInfo doctors = 1;
  int32 total_count = 2;
  bool success = 3;
  string message = 4;
}
