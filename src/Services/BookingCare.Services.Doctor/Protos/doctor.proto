syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Doctor.Protos";

package doctor;

// The doctor service definition
service DoctorService {
  // Get doctor by ID
  rpc GetDoctor (GetDoctorRequest) returns (DoctorResponse);

  // Get doctor by account ID
  rpc GetDoctorByAccountId (GetDoctorByAccountIdRequest) returns (DoctorResponse);

  // Create new doctor
  rpc CreateDoctor (CreateDoctorRequest) returns (DoctorResponse);

  // Delete doctor for Saga compensation
  rpc DeleteDoctor (DeleteDoctorRequest) returns (DeleteDoctorResponse);

  // Batch retrieval for performance optimization
  rpc GetDoctorsByAccountIds (GetDoctorsByAccountIdsRequest) returns (DoctorBatchResponse);

  // Get doctor basic info with position and specialty names (optimized for performance)
  rpc GetDoctorBasicInfo (GetDoctorBasicInfoRequest) returns (DoctorBasicInfoResponse);

  // Get multiple doctors basic info (batch operation for performance)
  rpc GetDoctorsBasicInfo (GetDoctorsBasicInfoRequest) returns (DoctorsBasicInfoResponse);

  // Get available doctors by hospital, specialty, date, and time (for appointment assignment)
  rpc GetAvailableDoctors (GetAvailableDoctorsRequest) returns (GetAvailableDoctorsResponse);

  // Get doctor price by price ID (for appointment rescheduling - Option 3)
  rpc GetDoctorPrice (GetDoctorPriceRequest) returns (GetDoctorPriceResponse);
}

// Request messages
message GetDoctorRequest {
  string id = 1;
}

message GetDoctorByAccountIdRequest {
  string account_id = 1;
}

message CreateDoctorRequest {
  string account_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string gender = 5;           // MALE, FEMALE, OTHER
  string address = 6;
  string specialty_id = 7;
  string position_id = 8;
  string hospital_id = 9;
  string bio = 10;
  int32 years_of_experience = 11;
  string avatar_url = 12;
}

// Request message for batch doctor retrieval
message GetDoctorsByAccountIdsRequest {
  repeated string account_ids = 1;
}

// Response messages
message DoctorResponse {
  string id = 1;
  string account_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string full_name = 6;
  string gender = 7;
  string address = 8;
  string specialty_id = 9;
  string position_id = 10;
  string hospital_id = 11;
  string bio = 12;
  int32 years_of_experience = 13;
  string avatar_url = 14;
  string created_at = 15; // ISO 8601
  string updated_at = 16; // ISO 8601
  string status = 17; // "ACTIVE" or "INACTIVE"
}

// Lightweight doctor information for performance optimization
message DoctorBasicInfo {
  string account_id = 1;
  string email = 2;
  string full_name = 3;
  string avatar_url = 4;
}

// Response message for batch doctor retrieval
message DoctorBatchResponse {
  repeated DoctorBasicInfo doctors = 1;
}

message DeleteDoctorRequest {
  string id = 1;
}

message DeleteDoctorResponse {
  bool success = 1;
  string message = 2;
}

// Request message for getting doctor basic info
message GetDoctorBasicInfoRequest {
  string id = 1;
}

// Request message for getting multiple doctors basic info
message GetDoctorsBasicInfoRequest {
  repeated string ids = 1;
}

// Response message for doctor basic info with position and specialty names
message DoctorBasicInfoResponse {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  string position_name = 6;
  string specialty_name = 7;
  string avatar_url = 8;
  string hospital_id = 9;
}

// Response message for multiple doctors basic info
message DoctorsBasicInfoResponse {
  repeated DoctorBasicInfoResponse doctors = 1;
}

// Request message for getting available doctors
message GetAvailableDoctorsRequest {
  string hospital_id = 1;
  string specialty_id = 2;
}

// Available doctor information (lightweight for performance)
message AvailableDoctorInfo {
  string id = 1;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  string avatar_url = 6;
  string position_name = 7;
  string specialty_name = 8;
  int32 years_of_experience = 9;
}

// Response message for available doctors
message GetAvailableDoctorsResponse {
  repeated AvailableDoctorInfo doctors = 1;
  int32 total_count = 2;
}

// Request message for getting doctor price by ID
message GetDoctorPriceRequest {
  string price_id = 1;
}

// Response message for doctor price
message GetDoctorPriceResponse {
  string id = 1;
  string doctor_id = 2;
  double amount = 5;
  string currency = 6; // "VND"
}
