syntax = "proto3"; // Specify the protocol buffer version

package doctor;
option csharp_namespace = "BookingCare.Services.Doctor.Protos";

import "google/protobuf/timestamp.proto"; // Import Google's timestamp type
import "google/protobuf/empty.proto"; // Import Google's empty type
import "Protos/position.proto"; // PositionInfo
import "Protos/price.proto";    // PriceInfo

// Service definition for Doctor operations
service DoctorService {
  // Doctor CRUD operations
  rpc CreateDoctor(CreateDoctorRequest) returns (CreateDoctorResponse);
  rpc GetDoctorById(GetDoctorByIdRequest) returns (GetDoctorResponse);
  rpc GetDoctorByEmail(GetDoctorByEmailRequest) returns (GetDoctorResponse);
  rpc UpdateDoctor(UpdateDoctorRequest) returns (UpdateDoctorResponse);
  rpc DeleteDoctor(DeleteDoctorRequest) returns (DeleteDoctorResponse);
  rpc GetDoctors(GetDoctorsRequest) returns (GetDoctorsResponse);

  // Position & Price RPCs moved to position.proto and price.proto

  // Validation operations
  rpc ValidateDoctor(ValidateDoctorRequest) returns (ValidateDoctorResponse);
}

// =============================================================================
// DOCTOR MESSAGES
// =============================================================================

// Request to create a new doctor
message CreateDoctorRequest {
  string account_id = 1;        // GUID of the associated account
  string email = 2;             // Doctor's email address
  string address = 3;           // Doctor's address (optional)
  string first_name = 4;        // Doctor's first name
  string last_name = 5;         // Doctor's last name
  string gender = 6;            // Gender: "MALE", "FEMALE", "OTHER"
  string position_id = 7;       // GUID of the position (optional)
  string specialty_id = 8;      // GUID of the specialty (optional)
  string clinic_id = 9;         // GUID of the clinic (optional)
  string bio = 10;              // Doctor's biography (optional)
  int32 years_of_experience = 11; // Years of experience
  string avatar_url = 12;       // URL to doctor's avatar (optional)
}

// Response for doctor creation
message CreateDoctorResponse {
  bool success = 1;             // Whether the operation was successful
  string error_message = 2;     // Error message if operation failed
  DoctorDetail doctor = 3;      // Created doctor information
}

// Request to get doctor by ID
message GetDoctorByIdRequest {
  string id = 1;                // GUID of the doctor
  // Optional expansions to avoid over-fetching
  bool include_position = 2;    // include embedded position
  bool include_prices = 3;      // include embedded prices
}

// Request to get doctor by email
message GetDoctorByEmailRequest {
  string email = 1;             // Doctor's email address
}

// Response for getting doctor information
message GetDoctorResponse {
  bool success = 1;             // Whether the operation was successful
  string error_message = 2;     // Error message if operation failed
  DoctorDetail doctor = 3;      // Doctor detailed information
}

// Request to update doctor information
message UpdateDoctorRequest {
  string id = 1;                // GUID of the doctor to update
  string email = 2;             // Updated email address
  string address = 3;           // Updated address
  string first_name = 4;        // Updated first name
  string last_name = 5;         // Updated last name
  string gender = 6;            // Updated gender
  string position_id = 7;       // Updated position ID
  string specialty_id = 8;      // Updated specialty ID
  string clinic_id = 9;         // Updated clinic ID
  string bio = 10;              // Updated biography
  int32 years_of_experience = 11; // Updated years of experience
  string avatar_url = 12;       // Updated avatar URL
}

// Response for doctor update
message UpdateDoctorResponse {
  bool success = 1;             // Whether the operation was successful
  string error_message = 2;     // Error message if operation failed
  DoctorDetail doctor = 3;      // Updated doctor information
}

// Request to delete doctor
message DeleteDoctorRequest {
  string id = 1;                // GUID of the doctor to delete
}

// Response for doctor deletion
message DeleteDoctorResponse {
  bool success = 1;             // Whether the operation was successful
  string error_message = 2;     // Error message if operation failed
}

// Request to get doctors with filtering and pagination
message GetDoctorsRequest {
  int32 page_number = 1;        // Page number for pagination
  int32 page_size = 2;          // Number of items per page (0 = return all)
  string search_term = 3;       // Search term for filtering
  string account_id = 4;        // Filter by account ID
  string position_id = 5;       // Filter by position ID
  string specialty_id = 6;      // Filter by specialty ID
  string clinic_id = 7;         // Filter by clinic ID
  string gender = 8;            // Filter by gender
  int32 min_years_of_experience = 9; // Minimum years of experience
  int32 max_years_of_experience = 10; // Maximum years of experience
}

// Response for getting doctors list
message GetDoctorsResponse {
  bool success = 1;             // Whether the operation was successful
  string error_message = 2;     // Error message if operation failed
  repeated DoctorSummary doctors = 3; // List of doctors (summary only)
  int32 total_count = 4;        // Total number of doctors
  int32 page_number = 5;        // Current page number
  int32 page_size = 6;          // Page size
  int32 total_pages = 7;        // Total number of pages
}

// Doctor summary (used for list views)
message DoctorSummary {
  string id = 1;                // Doctor's GUID
  string account_id = 2;        // Associated account GUID
  string email = 3;             // Email address
  string address = 4;           // Address
  string first_name = 5;        // First name
  string last_name = 6;         // Last name
  string gender = 7;            // Gender
  string position_id = 8;       // Position GUID
  string specialty_id = 9;      // Specialty GUID
  string clinic_id = 10;        // Clinic GUID
  string bio = 11;              // Biography
  int32 years_of_experience = 12; // Years of experience
  string avatar_url = 13;       // Avatar URL
  google.protobuf.Timestamp created_at = 14; // Creation timestamp
  google.protobuf.Timestamp updated_at = 15; // Last update timestamp
  // Calculated dynamic price based on rules (nullable -> 0 means not available)
  double dynamic_price = 16;
}

// Doctor detail (expandable parts)
message DoctorDetail {
  string id = 1;
  string account_id = 2;
  string email = 3;
  string address = 4;
  string first_name = 5;
  string last_name = 6;
  string gender = 7;
  string position_id = 8;
  string specialty_id = 9;
  string clinic_id = 10;
  string bio = 11;
  int32 years_of_experience = 12;
  string avatar_url = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  double dynamic_price = 16;
  // Optional expansions
  position.PositionInfo position = 17;             // present only if requested
  repeated price.PriceInfo prices = 18;            // present only if requested
}

// Position/Price and doctor-price messages moved to dedicated proto files

// =============================================================================
// VALIDATION MESSAGES
// =============================================================================

// Request to validate doctor existence
message ValidateDoctorRequest {
  string id = 1;                // Doctor's GUID to validate
}

// Response for doctor validation
message ValidateDoctorResponse {
  bool success = 1;             // Whether the operation was successful
  string error_message = 2;     // Error message if operation failed
  bool exists = 3;              // Whether the doctor exists
}
