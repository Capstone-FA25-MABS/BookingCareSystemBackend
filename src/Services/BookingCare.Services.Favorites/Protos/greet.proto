syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Favorite";

package greet;


// The favorites service definition for inter-service communication.
service FavoritesService {
  // Check multiple doctors favorite status for a patient
  rpc CheckMultipleFavorites (CheckMultipleFavoritesRequest) returns (CheckMultipleFavoritesResponse);
  
  // Check single doctor favorite status for a patient
  rpc CheckSingleFavorite (CheckSingleFavoriteRequest) returns (CheckSingleFavoriteResponse);
  
  // Get patient's favorite count
  rpc GetPatientFavoriteCount (GetPatientFavoriteCountRequest) returns (GetPatientFavoriteCountResponse);
}


// Check multiple favorites request
message CheckMultipleFavoritesRequest {
  string patient_id = 1;
  repeated string doctor_ids = 2;
}

// Check multiple favorites response
message CheckMultipleFavoritesResponse {
  string patient_id = 1;
  repeated string favorited_doctor_ids = 2;
  int32 total_checked = 3;
  int32 total_favorited = 4;
  bool success = 5;
  string message = 6;
}

// Check single favorite request
message CheckSingleFavoriteRequest {
  string patient_id = 1;
  string doctor_id = 2;
}

// Check single favorite response
message CheckSingleFavoriteResponse {
  string patient_id = 1;
  string doctor_id = 2;
  bool is_favorited = 3;
  bool success = 4;
  string message = 5;
}

// Get patient favorite count request
message GetPatientFavoriteCountRequest {
  string patient_id = 1;
}

// Get patient favorite count response
message GetPatientFavoriteCountResponse {
  string patient_id = 1;
  int64 favorite_count = 2;
  bool success = 3;
  string message = 4;
}
