syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Notification.Protos";

package otp;

service OtpVerifier {
  rpc Verify (VerifyRequest) returns (VerifyResponse);
  rpc SendOtp (SendOtpRequest) returns (SendOtpResponse);
}

message VerifyRequest {
  string key = 1;
  string otp = 2;
}

message VerifyResponse {
  bool verified = 1;
}

message SendOtpRequest {
  string email = 1;
  string phone = 2;
  string purpose = 3; // e.g., "CONTRACT_SIGNING", "LOGIN", "REGISTER"
}

message SendOtpResponse {
  bool success = 1;
  string message = 2;
  string key = 3; // OTP key for verification
}
