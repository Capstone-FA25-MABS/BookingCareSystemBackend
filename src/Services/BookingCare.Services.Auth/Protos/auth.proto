syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Auth.Protos";

package auth;

// The Auth service definition
service AuthService {
  // Account existence check
  rpc CheckAccountExists (CheckAccountExistsRequest) returns (CheckAccountExistsResponse);
  // Get account status by IDs
  rpc GetAccountStatusByIds (GetAccountStatusByIdsRequest) returns (GetAccountStatusByIdsResponse);
  // Create new account for Saga
  rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
  // Create external account for Google/Facebook login
  rpc CreateExternalAccount (CreateExternalAccountRequest) returns (CreateExternalAccountResponse);
  // Delete account for Saga compensation
  rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
  // Get account details with role-based information
  rpc GetAccountDetails (GetAccountDetailsRequest) returns (GetAccountDetailsResponse);
  // Get account IDs by role
  rpc GetAccountIdsByRole (GetAccountIdsByRoleRequest) returns (GetAccountIdsByRoleResponse);
}

message CheckAccountExistsRequest {
  string email = 1;
  string phone_number = 2;
}

message CheckAccountExistsResponse {
  bool exists = 1;
  string message = 2;
}

message GetAccountStatusByIdsRequest {
  repeated string account_ids = 1;
}

message GetAccountStatusByIdsResponse {
  repeated AccountStatus account_statuses = 1;
  bool success = 2;
  string message = 3;
}

message AccountStatus {
  string account_id = 1;
  int32 status = 2; // 0 = ACTIVE, 1 = INACTIVE
  bool found = 3;
}

message CreateAccountRequest {
  string email = 1;
  string password = 2;
  string phone_number = 3;
  string role = 4;
  string purpose = 5;
  string channel = 6;
  string proof = 7;
  string issued_at = 8;
}

message CreateAccountResponse {
  bool success = 1;
  string account_id = 2;
  string message = 3;
  string email = 4;
}

message CreateExternalAccountRequest {
  string email = 1;
  string full_name = 2;
  string avatar_url = 3;
  string external_provider = 4;
  string external_user_id = 5;
}

message CreateExternalAccountResponse {
  bool success = 1;
  string account_id = 2;
  string message = 3;
  string email = 4;
}

message DeleteAccountRequest {
  string account_id = 1;
}

message DeleteAccountResponse {
  bool success = 1;
  string message = 2;
}

message GetAccountDetailsRequest {
  repeated string account_ids = 1;
}

message GetAccountDetailsResponse {
  bool success = 1;
  string message = 2;
  repeated AccountDetail account_details = 3;
}

message AccountDetail {
  string account_id = 1;
  string email = 2;
  string full_name = 3;
  string avatar_url = 4;
  string role = 5;
  bool found = 6;
}

message GetAccountIdsByRoleRequest {
  string role = 1;
  bool active_only = 2; // Optional: only return active accounts
}

message GetAccountIdsByRoleResponse {
  bool success = 1;
  string message = 2;
  repeated string account_ids = 3;
}
