syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Auth.Protos";

package auth;

// The Auth service definition
service AuthService {
  // Account existence check
  rpc CheckAccountExists (CheckAccountExistsRequest) returns (CheckAccountExistsResponse);
}

message CheckAccountExistsRequest {
  string email = 1;
  string phone_number = 2;
}

message CheckAccountExistsResponse {
  bool exists = 1;
  string message = 2;
}
