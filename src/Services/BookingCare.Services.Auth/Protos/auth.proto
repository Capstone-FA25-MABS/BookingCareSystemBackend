syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Auth.Protos";

package auth;

// The Auth service definition
service AuthService {
  // User authentication
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  
  // User management
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  
  // Role management
  rpc GetRoles (GetRolesRequest) returns (RolesResponse);
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse);
  rpc RemoveRole (RemoveRoleRequest) returns (RemoveRoleResponse);
  
  // Account existence check
  rpc CheckAccountExists (CheckAccountExistsRequest) returns (CheckAccountExistsResponse);
}

// Request/Response messages
message LoginRequest {
  string username = 1;
  string password = 2;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string phone_number = 4;
}

message AuthResponse {
  bool success = 1;
  string token = 2;
  string refresh_token = 3;
  UserResponse user = 4;
  repeated string roles = 5;
  repeated PermissionResponse permissions = 6;
  string message = 7;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  bool success = 1;
  string token = 2;
  string refresh_token = 3;
  string message = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string phone_number = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated string roles = 8;
}

message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string phone_number = 4;
  string status = 5;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

message GetRolesRequest {
  string user_id = 1;
}

message RolesResponse {
  repeated string roles = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message AssignRoleResponse {
  bool success = 1;
  string message = 2;
}

message RemoveRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message RemoveRoleResponse {
  bool success = 1;
  string message = 2;
}

message PermissionResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message AssignPermissionRequest {
  string role_id = 1;
  repeated string permission_ids = 2;
}

message RemovePermissionRequest {
  string role_id = 1;
  repeated string permission_ids = 2;
}

message CheckAccountExistsRequest {
  string email = 1;
  string phone_number = 2;
}

message CheckAccountExistsResponse {
  bool exists = 1;
  string message = 2;
}
