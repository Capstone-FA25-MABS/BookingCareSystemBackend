syntax = "proto3";

option csharp_namespace = "BookingCare.Services.Review.Grpc";

package reviewservice;

// Import Google protobuf types
import "google/protobuf/wrappers.proto";

// Review Statistics Service for inter-service communication
service ReviewService {
  // Gets detailed statistics with rating distribution for a single doctor
  rpc GetDoctorDetailedStatistics (GetDoctorStatisticsRequest) returns (ReviewDetailedStatisticsResponse);
  
  // Gets detailed statistics with rating distribution for a single clinic service
  rpc GetServiceDetailedStatistics (GetServiceStatisticsRequest) returns (ReviewDetailedStatisticsResponse);
  
  // Gets statistics for multiple doctors in batch (performance optimized)
  rpc GetBatchDoctorsStatistics (BatchDoctorsStatisticsRequest) returns (BatchDoctorsStatisticsResponse);
  
  // Gets statistics for multiple clinic services in batch (performance optimized)
  rpc GetBatchServicesStatistics (BatchServicesStatisticsRequest) returns (BatchServicesStatisticsResponse);
  
  // Gets paginated reviews for a doctor
  rpc GetDoctorReviews (GetDoctorReviewsRequest) returns (PagedReviewsResponse);
  
  // Gets paginated reviews for a clinic service
  rpc GetServiceReviews (GetServiceReviewsRequest) returns (PagedReviewsResponse);
  
  // Health check
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
}

// Health check messages
message HealthCheckRequest {
}

message HealthCheckResponse {
  string status = 1;
  string service = 2;
  int64 timestamp = 3;
}

// Single statistics request messages
message GetDoctorStatisticsRequest {
  string doctor_id = 1;
}

message GetServiceStatisticsRequest {
  string service_id = 1;
}

// Statistics response messages (optimized for batch operations - no rating distribution)
message ReviewStatisticsResponse {
  string target_id = 1;
  TargetType target_type = 2;
  double average_rating = 3;
  int64 total_reviews = 4;
  // rating_distribution removed for performance optimization in batch operations
}

// Detailed statistics response messages (with rating distribution for single endpoints)
message ReviewDetailedStatisticsResponse {
  string target_id = 1;
  TargetType target_type = 2;
  double average_rating = 3;
  int64 total_reviews = 4;
  map<int32, int64> rating_distribution = 5;
}

// Batch statistics request messages
message BatchDoctorsStatisticsRequest {
  repeated string doctor_ids = 1;
}

message BatchServicesStatisticsRequest {
  repeated string service_ids = 1;
}

// Batch statistics response messages
message BatchDoctorsStatisticsResponse {
  map<string, ReviewStatisticsResponse> doctor_statistics = 1;
  repeated string not_found_doctor_ids = 2;
  int32 total_processed = 3;
  int32 with_statistics = 4;
}

message BatchServicesStatisticsResponse {
  map<string, ReviewStatisticsResponse> service_statistics = 1;
  repeated string not_found_service_ids = 2;
  int32 total_processed = 3;
  int32 with_statistics = 4;
}

// Review listing request messages
message GetDoctorReviewsRequest {
  string doctor_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetServiceReviewsRequest {
  string service_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// Review response messages
message ReviewResponse {
  string id = 1;
  string patient_id = 2;
  TargetType target_type = 3;
  google.protobuf.StringValue doctor_id = 4;
  google.protobuf.StringValue clinic_service_id = 5;
  int32 rating = 6;
  string comment = 7;
  repeated ReplyResponse replies = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message ReplyResponse {
  string id = 1;
  string author_id = 2;
  string content = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message PagedReviewsResponse {
  repeated ReviewResponse reviews = 1;
  int64 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
  bool has_next_page = 6;
  bool has_previous_page = 7;
}

// Enums
enum TargetType {
  DOCTOR = 0;
  SERVICE = 1;
}
