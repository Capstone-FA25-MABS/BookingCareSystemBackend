syntax = "proto3";

option csharp_namespace = "BookingCare.Services.ServiceMedical.Protos";

package servicemedical;

// The service medical service definition
service ServiceMedicalService {
  // Get service categories (parents)
  rpc GetParentServiceCategories (GetParentServiceCategoriesRequest) returns (ServiceCategoriesResponse);
  
  // Get service category children
  rpc GetServiceCategoryChildren (GetServiceCategoryChildrenGrpcRequest) returns (ServiceCategoriesResponse);
  
  // Get hospitals by service category
  rpc GetHospitalsByServiceCategory (GetHospitalsByServiceCategoryGrpcRequest) returns (HospitalsByServiceCategoryResponse);
  
  // Get service by ID
  rpc GetService (GetServiceGrpcRequest) returns (ServiceResponse);
  
  // Get services by category
  rpc GetServicesByCategory (GetServicesByCategoryGrpcRequest) returns (ServicesResponse);
  
  // Validate service medical
  rpc ValidateServiceMedical (ValidateServiceMedicalRequest) returns (ValidateServiceMedicalResponse);
}

// Request messages
message GetParentServiceCategoriesRequest {
  // Empty request
}

message GetServiceCategoryChildrenGrpcRequest {
  string parent_id = 1;
  bool include_inactive = 2;
}

message GetHospitalsByServiceCategoryGrpcRequest {
  string service_category_id = 1;
  bool include_inactive = 2;
}

message GetServiceGrpcRequest {
  string id = 1;
}

message GetServicesByCategoryGrpcRequest {
  string service_category_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool include_inactive = 4;
}

message ValidateServiceMedicalRequest {
  string id = 1;
}

// Response messages
message ServiceCategoryResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  string parent_id = 5;
  string status = 6;
}

message ServiceCategoriesResponse {
  repeated ServiceCategoryResponse categories = 1;
}

message ServiceResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string price = 4; // Using string for decimal
  string image_url = 5;
  string hospital_id = 6;
  string service_category_id = 7;
  int32 duration_time = 8;
  string status = 9;
  ServiceCategoryResponse service_category = 10;
}

message ServicesResponse {
  repeated ServiceResponse services = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

message HospitalsByServiceCategoryResponse {
  string service_category_id = 1;
  string service_category_name = 2;
  repeated string hospital_ids = 3;
  int32 total_hospitals = 4;
}

message ValidateServiceMedicalResponse {
  bool is_valid = 1;
  bool is_active = 2;
  string service_id = 3;
  string service_name = 4;
}
