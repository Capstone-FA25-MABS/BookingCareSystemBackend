syntax = "proto3";

package bookingcare.user;

option csharp_namespace = "BookingCare.Shared.Protos.User";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "Protos/common.proto";

// User Management Service
service UserService {
  // User profile management
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc GetUserByAccountId(GetUserByAccountIdRequest) returns (GetUserByAccountIdResponse);
  
  // User preferences
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse);
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);
  
  // User medical history
  rpc AddMedicalHistory(AddMedicalHistoryRequest) returns (AddMedicalHistoryResponse);
  rpc GetMedicalHistory(GetMedicalHistoryRequest) returns (GetMedicalHistoryResponse);
  rpc UpdateMedicalHistory(UpdateMedicalHistoryRequest) returns (UpdateMedicalHistoryResponse);
  rpc DeleteMedicalHistory(DeleteMedicalHistoryRequest) returns (DeleteMedicalHistoryResponse);
  
  // User emergency contacts
  rpc AddEmergencyContact(AddEmergencyContactRequest) returns (AddEmergencyContactResponse);
  rpc GetEmergencyContacts(GetEmergencyContactsRequest) returns (GetEmergencyContactsResponse);
  rpc UpdateEmergencyContact(UpdateEmergencyContactRequest) returns (UpdateEmergencyContactResponse);
  rpc DeleteEmergencyContact(DeleteEmergencyContactRequest) returns (DeleteEmergencyContactResponse);
}

// User model (from users table)
message User {
  int64 id = 1;
  int64 account_id = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  google.protobuf.Timestamp date_of_birth = 6;
  bookingcare.common.Gender gender = 7;
  bookingcare.common.Address address = 8;
  string emergency_contact_name = 9;
  string emergency_contact_phone = 10;
  string emergency_contact_relationship = 11;
  string profile_picture_url = 12;
  string medical_history = 13;
  string allergies = 14;
  string current_medications = 15;
  string insurance_provider = 16;
  string insurance_policy_number = 17;
  UserPreferences preferences = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

// User preferences
message UserPreferences {
  string preferred_language = 1;
  string timezone = 2;
  bool email_notifications = 3;
  bool sms_notifications = 4;
  bool appointment_reminders = 5;
  bool marketing_emails = 6;
  string notification_frequency = 7; // immediate, daily, weekly
}

// Medical history entry
message MedicalHistoryEntry {
  int64 id = 1;
  int64 user_id = 2;
  string condition = 3;
  string description = 4;
  google.protobuf.Timestamp diagnosis_date = 5;
  string treatment = 6;
  string doctor_name = 7;
  string notes = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Emergency contact
message EmergencyContact {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string phone = 4;
  string email = 5;
  string relationship = 6;
  bool is_primary = 7;
  bookingcare.common.Address address = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// User management requests/responses
message CreateUserRequest {
  int64 account_id = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  bookingcare.common.Gender gender = 6;
  bookingcare.common.Address address = 7;
  string emergency_contact_name = 8;
  string emergency_contact_phone = 9;
  string emergency_contact_relationship = 10;
  string medical_history = 11;
  string allergies = 12;
  string current_medications = 13;
  string insurance_provider = 14;
  string insurance_policy_number = 15;
  UserPreferences preferences = 16;
}

message CreateUserResponse {
  bookingcare.common.ApiResponse response = 1;
  User user = 2;
}

message GetUserRequest {
  int64 id = 1;
}

message GetUserResponse {
  bookingcare.common.ApiResponse response = 1;
  User user = 2;
}

message GetUserByAccountIdRequest {
  int64 account_id = 1;
}

message GetUserByAccountIdResponse {
  bookingcare.common.ApiResponse response = 1;
  User user = 2;
}

message UpdateUserRequest {
  int64 id = 1;
  google.protobuf.StringValue first_name = 2;
  google.protobuf.StringValue last_name = 3;
  google.protobuf.StringValue phone = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  bookingcare.common.Gender gender = 6;
  bookingcare.common.Address address = 7;
  google.protobuf.StringValue emergency_contact_name = 8;
  google.protobuf.StringValue emergency_contact_phone = 9;
  google.protobuf.StringValue emergency_contact_relationship = 10;
  google.protobuf.StringValue profile_picture_url = 11;
  google.protobuf.StringValue medical_history = 12;
  google.protobuf.StringValue allergies = 13;
  google.protobuf.StringValue current_medications = 14;
  google.protobuf.StringValue insurance_provider = 15;
  google.protobuf.StringValue insurance_policy_number = 16;
}

message UpdateUserResponse {
  bookingcare.common.ApiResponse response = 1;
  User user = 2;
}

message DeleteUserRequest {
  int64 id = 1;
}

message DeleteUserResponse {
  bookingcare.common.ApiResponse response = 1;
}

message GetUsersRequest {
  bookingcare.common.PaginationRequest pagination = 1;
  bookingcare.common.Gender gender_filter = 2;
  google.protobuf.StringValue insurance_provider_filter = 3;
}

message GetUsersResponse {
  bookingcare.common.ApiResponse response = 1;
  repeated User users = 2;
  bookingcare.common.PaginationResponse pagination = 3;
}

// User preferences requests/responses
message UpdateUserPreferencesRequest {
  int64 user_id = 1;
  UserPreferences preferences = 2;
}

message UpdateUserPreferencesResponse {
  bookingcare.common.ApiResponse response = 1;
  UserPreferences preferences = 2;
}

message GetUserPreferencesRequest {
  int64 user_id = 1;
}

message GetUserPreferencesResponse {
  bookingcare.common.ApiResponse response = 1;
  UserPreferences preferences = 2;
}

// Medical history requests/responses
message AddMedicalHistoryRequest {
  int64 user_id = 1;
  string condition = 2;
  string description = 3;
  google.protobuf.Timestamp diagnosis_date = 4;
  string treatment = 5;
  string doctor_name = 6;
  string notes = 7;
}

message AddMedicalHistoryResponse {
  bookingcare.common.ApiResponse response = 1;
  MedicalHistoryEntry entry = 2;
}

message GetMedicalHistoryRequest {
  int64 user_id = 1;
  bookingcare.common.PaginationRequest pagination = 2;
}

message GetMedicalHistoryResponse {
  bookingcare.common.ApiResponse response = 1;
  repeated MedicalHistoryEntry entries = 2;
  bookingcare.common.PaginationResponse pagination = 3;
}

message UpdateMedicalHistoryRequest {
  int64 id = 1;
  google.protobuf.StringValue condition = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.Timestamp diagnosis_date = 4;
  google.protobuf.StringValue treatment = 5;
  google.protobuf.StringValue doctor_name = 6;
  google.protobuf.StringValue notes = 7;
}

message UpdateMedicalHistoryResponse {
  bookingcare.common.ApiResponse response = 1;
  MedicalHistoryEntry entry = 2;
}

message DeleteMedicalHistoryRequest {
  int64 id = 1;
}

message DeleteMedicalHistoryResponse {
  bookingcare.common.ApiResponse response = 1;
}

// Emergency contact requests/responses
message AddEmergencyContactRequest {
  int64 user_id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string relationship = 5;
  bool is_primary = 6;
  bookingcare.common.Address address = 7;
}

message AddEmergencyContactResponse {
  bookingcare.common.ApiResponse response = 1;
  EmergencyContact contact = 2;
}

message GetEmergencyContactsRequest {
  int64 user_id = 1;
}

message GetEmergencyContactsResponse {
  bookingcare.common.ApiResponse response = 1;
  repeated EmergencyContact contacts = 2;
}

message UpdateEmergencyContactRequest {
  int64 id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue phone = 3;
  google.protobuf.StringValue email = 4;
  google.protobuf.StringValue relationship = 5;
  google.protobuf.BoolValue is_primary = 6;
  bookingcare.common.Address address = 7;
}

message UpdateEmergencyContactResponse {
  bookingcare.common.ApiResponse response = 1;
  EmergencyContact contact = 2;
}

message DeleteEmergencyContactRequest {
  int64 id = 1;
}

message DeleteEmergencyContactResponse {
  bookingcare.common.ApiResponse response = 1;
}
