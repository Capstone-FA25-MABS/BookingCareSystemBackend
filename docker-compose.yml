      - "1431:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Auth@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_auth_data:/var/opt/mssql
    networks:
      - bookingcare-network
    restart: unless-stopped
    healthcheck:
      # test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Auth@1234!", "-Q", "SELECT 1"]
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

