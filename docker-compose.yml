# Docker Compose for BookingCare Microservices
version: '3.8'

services:
  # ====================
  # Infrastructure Services
  # ====================
  
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: bookingcare_rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=bookingcare
      - RABBITMQ_DEFAULT_PASS=bookingcare@1234
      - RABBITMQ_DEFAULT_VHOST=/
      - RABBITMQ_CONFIG_FILE=/etc/rabbitmq/rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - bookingcare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: bookingcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookingcare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

