  # ====================
  # API Gateway
  # ====================
  
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/BookingCare.ApiGateway.Ocelot/Dockerfile
    container_name: bookingcare_api_gateway
    ports:
      - "8484:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - auth-service
      - user-service
      - doctor-service
    networks:
      - bookingcare-network
    restart: unless-stopped

  # ====================
  # Core Services
