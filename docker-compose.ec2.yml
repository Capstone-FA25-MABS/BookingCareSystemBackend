# BookingCare Docker Compose Configuration for EC2
# This file provides an example of how to run services on EC2
# In actual deployment, GitHub Actions will run individual containers

version: '3.8'

networks:
  bookingcare-network:
    driver: bridge
    name: bookingcare-network

services:
  # API Gateway
  apigateway:
    image: ${ECR_REGISTRY}/bookingcare-apigateway:${VERSION_APIGATEWAY:-latest}
    container_name: bookingcare-apigateway
    restart: unless-stopped
    networks:
      - bookingcare-network
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
    depends_on:
      - auth
      - user
      - appointment
      - doctor
      - hospital

  # Auth Service
  auth:
    image: ${ECR_REGISTRY}/bookingcare-auth:${VERSION_AUTH:-latest}
    container_name: bookingcare-auth
    restart: unless-stopped
    networks:
      - bookingcare-network
    ports:
      - "6010:80"
      - "6110:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}

  # User Service
  user:
    image: ${ECR_REGISTRY}/bookingcare-user:${VERSION_USER:-latest}
    container_name: bookingcare-user
    restart: unless-stopped
    networks:
      - bookingcare-network
