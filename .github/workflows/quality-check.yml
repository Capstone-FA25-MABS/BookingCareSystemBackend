name: Quality Check Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '8.0.204'
  AWS_REGION: us-east-1
#   ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # Code Quality and Testing
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore BookingCareSystem.sln

      - name: Format check
        run: dotnet format BookingCareSystem.sln --verify-no-changes --verbosity diagnostic

      - name: Build solution
        run: dotnet build BookingCareSystem.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test BookingCareSystem.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella

