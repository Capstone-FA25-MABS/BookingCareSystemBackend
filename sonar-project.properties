# SonarCloud Configuration
sonar.projectKey=Capstone-FA25_BookingCareSystemBackend
sonar.organization=capstone-fa25-1

# Project Information
sonar.projectName=BookingCareSystemBackend
sonar.projectVersion=1.0

# Source directories
sonar.sources=src

# Language
sonar.language=cs

# Exclusions - Ignore auto-generated files, migrations, bin, obj folders
# Pattern: **/folder/** means exclude all files in any 'folder' directory at any level
sonar.exclusions=\
  **/bin/**/*,\
  **/obj/**/*,\
  **/Migrations/**/*,\
  **/Data/Migrations/**/*,\
  **/*.Designer.cs,\
  **/DbContextModelSnapshot.cs

# Copy-Paste Detection exclusions
sonar.cpd.exclusions=\
  **/Migrations/**/*,\
  **/Data/Migrations/**/*

# Test exclusions
sonar.test.exclusions=\
  **/tests/**/*,\
  **/*Test.cs,\
  **/*Tests.cs
