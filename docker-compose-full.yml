      - ConnectionStrings__DefaultConnection=Server=sqlserver-discount,1433;Database=MABS_Discount;User Id=sa;Password=Discount123!;TrustServerCertificate=true
    networks:
      - bookingcare-network
    restart: unless-stopped

  doctor-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Doctor/Dockerfile
