      - ASPNETCORE_URLS=http://+:6010;http://+:6110
      - MongoDb__ConnectionString=mongodb://bookingcare:password123@mongodb:27017
      - MongoDb__DatabaseName=MABS_Notification
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Password=bookingcare@1234
    networks:
      - bookingcare-network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Payment/Dockerfile
    container_name: bookingcare_payment_service
    ports:
      - "6011:6011"
