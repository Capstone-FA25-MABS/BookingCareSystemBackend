    restart: unless-stopped

  sqlserver-appointment:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_appointment
    ports:
      - "1450:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Appointment@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_appointment_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-hospital:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_hospital
    ports:
      - "1448:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Hospital@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_hospital_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-schedule:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_schedule
    ports:
      - "1446:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Schedule@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_schedule_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-payment:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_payment
    ports:
      - "1451:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Payment@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_payment_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-servicemedical:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_servicemedical
    ports:
      - "1452:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ServiceMedical@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_servicemedical_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-ai:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_ai
    ports:
      - "1453:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AI@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_ai_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Microservices
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/BookingCare.ApiGateway.Ocelot/Dockerfile
    container_name: bookingcare_api_gateway
    ports:
      - "5001:5001"
    depends_on:
      - auth-service
      - user-service
      - doctor-service
      - hospital-service
      - appointment-service
      - payment-service
      - review-service
      - content-service
      - discount-service
      - communication-service
      - notification-service
      - favorites-service
      - analytics-service
      - schedule-service
      - servicemedical-service
      - saga-service
      - ai-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast256BitsLong!@#$$%^&*()_+
      - Jwt__Issuer=MicroGrpcDemo.Auth
      - Jwt__Audience=MicroGrpcDemo.Services
    networks:
      - bookingcare-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.AI/Dockerfile
    container_name: bookingcare_ai_service
    ports:
      - "6001:6001"
      - "6101:6101"
    depends_on:
      sqlserver-ai:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6001;http://+:6101
      - ConnectionStrings__DefaultConnection=Server=sqlserver-ai,1433;Database=MABS_AI;User Id=sa;Password=AI@1234!;TrustServerCertificate=true
    networks:
      - bookingcare-network
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Analytics/Dockerfile
    container_name: bookingcare_analytics_service
    ports:
      - "6000:6000"
      - "6100:6100"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6000;http://+:6100
      - MongoDbSettings__ConnectionString=mongodb://bookingcare:password123@mongodb:27017
      - MongoDbSettings__DatabaseName=MABS_Analytics
    networks:
      - bookingcare-network
    restart: unless-stopped

  appointment-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Appointment/Dockerfile
    container_name: bookingcare_appointment_service
    ports:
      - "6002:6002"
      - "6102:6102"
    depends_on:
      sqlserver-appointment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6002;http://+:6102
      - ConnectionStrings__DefaultConnection=Server=sqlserver-appointment,1433;Database=MABS_Appointment;User Id=sa;Password=Appointment@1234!;TrustServerCertificate=true
      - Cache__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Password=bookingcare@1234
      - Services__Doctor__GrpcUrl=http://doctor-service:6108
      - Services__User__GrpcUrl=http://user-service:6116
      - Services__Hospital__GrpcUrl=http://hospital-service:6104
      - Services__Service__GrpcUrl=http://servicemedical-service:6115
      - Services__Payment__GrpcUrl=http://payment-service:6111
    networks:
      - bookingcare-network
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Auth/Dockerfile
    container_name: bookingcare_auth_service
    ports:
      - "6003:6003"
      - "6103:6103"
    depends_on:
      sqlserver-auth:
        condition: service_healthy
      sqlserver-saga:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6003;http://+:6103
      - ConnectionStrings__DefaultConnection=Server=sqlserver-auth,1433;Database=MABS_Auth;User Id=sa;Password=StrongP@ssw0rd!;TrustServerCertificate=true
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Password=bookingcare@1234
      - Saga__ConnectionString=Server=sqlserver-saga,1433;Database=MABS_Sagas;User Id=sa;Password=Saga@1234;TrustServerCertificate=true
      - OtpVerification__GrpcEndpoint=http://notification-service:6110
      - Services__Auth__GrpcUrl=http://auth-service:6103
      - Services__User__GrpcUrl=http://user-service:6116
      - Services__Doctor__GrpcUrl=http://doctor-service:6108
      - Services__Hospital__GrpcUrl=http://hospital-service:6104
    networks:
      - bookingcare-network
    restart: unless-stopped

  communication-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Communication/Dockerfile
    container_name: bookingcare_communication_service
    ports:
      - "6006:6006"
      - "6106:6106"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6006;http://+:6106
      - MongoDB__ConnectionString=mongodb://bookingcare:password123@mongodb:27017
      - MongoDB__DatabaseName=MABS_Communication
      - Cache__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=bookingcare
      - RabbitMQ__Password=bookingcare@1234
      - RabbitMQ__VirtualHost=/
      - GrpcServices__AuthService__Url=http://auth-service:6103
      - GrpcServices__UserService__Url=http://user-service:6116
    networks:
      - bookingcare-network
    restart: unless-stopped

  content-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Content/Dockerfile
    container_name: bookingcare_content_service
    ports:
      - "6005:6005"
      - "6105:6105"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6005;http://+:6105
      - MongoDbSettings__ConnectionString=mongodb://bookingcare:password123@mongodb:27017
