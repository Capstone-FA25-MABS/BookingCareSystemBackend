      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=bookingcare
      - RabbitMQ__Password=bookingcare@1234
      - RabbitMQ__VirtualHost=/
    networks:
      - bookingcare-network
    restart: unless-stopped

  review-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Review/Dockerfile
    container_name: bookingcare_review_service
    ports:
      - "6012:6012"
      - "6112:6112"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6012;http://+:6112
      - MongoDbSettings__ConnectionString=mongodb://bookingcare:password123@mongodb:27017
      - MongoDbSettings__DatabaseName=MABS_Reviews
      - Services__Auth__GrpcUrl=http://auth-service:6103
      - Services__User__GrpcUrl=http://user-service:6116
      - Services__Appointment__GrpcUrl=http://appointment-service:6102
    networks:
      - bookingcare-network
    restart: unless-stopped

  saga-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Saga/Dockerfile
    container_name: bookingcare_saga_service
    ports:
      - "6013:6013"
      - "6113:6113"
    depends_on:
      sqlserver-saga:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6013;http://+:6113
      - Saga__ConnectionString=Server=sqlserver-saga,1433;Database=MABS_Sagas;User Id=sa;Password=Saga@1234;TrustServerCertificate=true
    networks:
      - bookingcare-network
    restart: unless-stopped

  schedule-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.Schedule/Dockerfile
    container_name: bookingcare_schedule_service
    ports:
      - "6014:6014"
      - "6114:6114"
    depends_on:
      sqlserver-schedule:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6014;http://+:6114
      - ConnectionStrings__DefaultConnection=Server=sqlserver-schedule,1433;Database=MABS_Schedule;User Id=sa;Password=Schedule@1234!;TrustServerCertificate=true
      - Cache__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Password=bookingcare@1234
      - GrpcClients__Doctor__Address=http://doctor-service:6108
      - GrpcClients__ServiceMedical__Address=http://servicemedical-service:6115
      - GrpcClients__Appointment__Address=http://appointment-service:6102
    networks:
      - bookingcare-network
    restart: unless-stopped

  servicemedical-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.ServiceMedical/Dockerfile
    container_name: bookingcare_servicemedical_service
    ports:
      - "6015:6015"
      - "6115:6115"
    depends_on:
      sqlserver-servicemedical:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:6015;http://+:6115
      - ConnectionStrings__DefaultConnection=Server=sqlserver-servicemedical,1433;Database=MABS_ServiceMedical;User Id=sa;Password=ServiceMedical@1234!;TrustServerCertificate=true
      - GrpcClients__Hospital__Address=http://hospital-service:6104
      - AWS__S3__AccessKey={{access_key}}
      - AWS__S3__SecretKey={{secret_key}}
      - AWS__S3__BucketName=mabs-capstone-fa25-booking-care-s3-bucket
      - AWS__S3__Region=ap-southeast-1
    networks:
