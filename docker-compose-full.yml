# BookingCare Microservices - Full Docker Compose
# Sử dụng: docker-compose -f docker-compose-full.yml up -d

version: '3.8'

services:
  # Infrastructure
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: bookingcare_rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=bookingcare
      - RABBITMQ_DEFAULT_PASS=bookingcare@1234
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bookingcare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: bookingcare_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=bookingcare
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - bookingcare-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # SQL Server Databases
  sqlserver-discount:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_discount
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Discount123!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_discount_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-saga:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_saga
    ports:
      - "1400:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Saga@1234
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_saga_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-user:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_user
    ports:
      - "1445:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=User@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_user_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-doctor:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_doctor
    ports:
      - "1447:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Doctor@1234!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_doctor_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  sqlserver-auth:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: bookingcare_sqlserver_auth
    ports:
      - "1449:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongP@ssw0rd!
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_auth_data:/var/opt/mssql
    networks:
      - bookingcare-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 30s
