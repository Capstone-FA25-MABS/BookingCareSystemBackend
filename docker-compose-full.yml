  user-service:
    build:
      context: .
      dockerfile: src/Services/BookingCare.Services.User/Dockerfile
    container_name: bookingcare_user_service
    ports:
      - "6016:6016"
      - "6116:6116"
    depends_on:
      sqlserver-user:
        condition: service_healthy
      rabbitmq:
